<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledger Sign In</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233987e5'/%3E%3Cpath d='M8 20l6-6 4 4 6-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 26px; box-shadow: var(--shadow); }
    .login .brand { margin-bottom: 22px; }
    .login label { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 6px; color: var(--text-2); }
    .login input { width: 100%; font: 14px var(--sans); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
    .login input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .login .btn { width: 100%; justify-content: center; margin-top: 14px; padding: 10px 14px; }
    .login .err { color: var(--bad); font-size: 12.5px; min-height: 18px; margin-top: 10px; }
    .login .foot { color: var(--muted); font-size: 11.5px; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login" id="form">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 20l6-6 4 4 6-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><div class="brand-name">Ledger</div><div class="brand-sub">Cross-exchange arbitrage</div></div>
      </div>
      <label for="pw">Dashboard password</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus />
      <button class="btn btn-primary" type="submit" id="go">Sign in</button>
      <div class="err" id="err" role="alert"></div>
      <div class="foot">Paper trading · no real funds</div>
    </form>
  </div>
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch {}
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const go = document.getElementById('go'), err = document.getElementById('err');
      go.disabled = true; err.textContent = '';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
        const j = await r.json().catch(() => ({}));
        if (r.ok && j.ok) { location.href = '/'; return; }
        err.textContent = j.error || 'Sign-in failed.';
      } catch { err.textContent = 'Could not reach the bot engine.'; }
      go.disabled = false;
    });
  </script>
</body>
</html>
